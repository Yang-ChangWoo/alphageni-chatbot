# main에 push하면 Hugging Face Space(yangchangwoo/alphageni-chatbot)에 파일을 올려 자동으로 다시 빌드합니다.
# 저장소 Settings → Secrets and variables → Actions 에 HF_TOKEN(Write 권한 토큰)을 등록해야 합니다.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U huggingface_hub
      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN 시크릿이 없습니다. 저장소 Settings → Secrets and variables → Actions 에 Hugging Face Write 토큰을 HF_TOKEN 이름으로 추가하세요."
            exit 1
          fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id="yangchangwoo/alphageni-chatbot", repo_type="space", folder_path=".",
              ignore_patterns=[".git/*", ".github/*", "netlify/*", "db.sqlite3", ".venv/*"],
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]} from GitHub",
          )
          PY
      - name: Wait for Space build
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, time, sys, urllib.request
          from huggingface_hub import HfApi
          repo = "yangchangwoo/alphageni-chatbot"
          api = HfApi(token=os.environ["HF_TOKEN"])
          time.sleep(20)
          for i in range(90):  # 최대 약 30분
              stage = api.get_space_runtime(repo).stage
              print(f"[{i * 20}s] {stage}", flush=True)
              if stage == "RUNNING":
                  sys.exit(0)
              if stage in ("BUILD_ERROR", "RUNTIME_ERROR", "CONFIG_ERROR"):
                  kind = "build" if stage != "RUNTIME_ERROR" else "run"
                  req = urllib.request.Request(f"https://huggingface.co/api/spaces/{repo}/logs/{kind}",
                                               headers={"Authorization": f"Bearer {os.environ['HF_TOKEN']}"})
                  try:
                      with urllib.request.urlopen(req, timeout=20) as r:
                          print(r.read().decode("utf-8", "replace")[-15000:])
                  except Exception as e:
                      print("로그를 가져오지 못함:", e)
                  sys.exit(1)
              time.sleep(20)
          sys.exit("30분 안에 RUNNING이 되지 않음")
          PY
